# Runs the unit tests with a coverage check, and compiles both the app and the
# extension without signing, on every pull request and every push to main.
# It uses no secrets, so pull requests from forks can run it safely.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    # A standard hosted Apple Silicon runner (macos-15): free on public repositories.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests with coverage
        run: swift test --enable-code-coverage

      - name: Coverage check for CaptureCore (at least 90 percent)
        run: scripts/check-coverage.sh 90

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: XcodeGen must not change our plist and entitlements files
        run: git diff --exit-code -- App Extension

      - name: Build the app and the extension without signing
        run: |
          xcodebuild -scheme HotlineCapture -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: The built extension and app keep their Info.plist keys
        run: |
          set -eu
          products=$(xcodebuild -scheme HotlineCapture -configuration Release -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -showBuildSettings 2>/dev/null \
            | awk '/^ *BUILT_PRODUCTS_DIR =/ {print $3; exit}')
          app="$products/Hotline Capture.app"
          extension="$app/Contents/Library/SystemExtensions/io.github.petercipov.hotlinecapture.extension.systemextension"
          /usr/libexec/PlistBuddy -c "Print :NSSystemExtensionUsageDescription" "$extension/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NetworkExtension:NEProviderClasses" "$extension/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSUIElement" "$app/Contents/Info.plist"
