# Builds, signs, notarizes and publishes Hotline Capture. Two ways to start it:
#   1. push a tag such as v0.1.0, or
#   2. the "Run workflow" button in the Actions tab, with a version such as 0.1.0.
#      The release then creates the tag itself, on the commit of main that was built.
# Never started by pull requests, because it uses the Apple secrets.
# The one-time setup of those secrets is in docs/release-setup.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, numbers only, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write # to attach the files to the GitHub release

jobs:
  release:
    # The button only works from main, so a stray branch cannot publish a release.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi
          # Apple allows only numbers and dots in a version.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' must look like 0.1.0 (numbers only)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check that all secrets are set
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_APP: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP }}
          APPLE_PROVISIONING_PROFILE_EXT: ${{ secrets.APPLE_PROVISIONING_PROFILE_EXT }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_APP APPLE_PROVISIONING_PROFILE_EXT \
            APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. See docs/release-setup.md."
              exit 1
            fi
          done

      - name: Unit tests with coverage
        run: |
          swift test --enable-code-coverage
          scripts/check-coverage.sh 90

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install the certificate and the provisioning profiles
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_APP: ${{ secrets.APPLE_PROVISIONING_PROFILE_APP }}
          APPLE_PROVISIONING_PROFILE_EXT: ${{ secrets.APPLE_PROVISIONING_PROFILE_EXT }}
        run: |
          # A temporary keychain that is deleted at the end of the job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          # Xcode finds a profile by its name (PROVISIONING_PROFILE_SPECIFIER in project.yml)
          # among the files here; each file is named by the profile's own id, as Xcode does.
          install_profile() {
            profile="$RUNNER_TEMP/profile.provisionprofile"
            echo "$1" | base64 --decode > "$profile"
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            mv "$profile" "$PROFILES/$uuid.provisionprofile"
          }
          install_profile "$APPLE_PROVISIONING_PROFILE_APP"
          install_profile "$APPLE_PROVISIONING_PROFILE_EXT"

      - name: Build, sign and notarize
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # The build number rises with every run, as the extension needs,
          # or macOS keeps the old one.
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" scripts/build-release.sh

      - name: Publish the files on the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # With a pushed tag this uses that tag. With the button it creates the tag
          # v<version> on the commit that was built.
          gh release create "v$VERSION" \
            dist/HotlineCapture.app.tar dist/HotlineCapture.app.tar.sha256 dist/HotlineCapture.sbom.cdx.json \
            --target "$GITHUB_SHA" \
            --title "Hotline Capture v$VERSION" \
            --notes "Signed and notarized, Apple Silicon only, macOS 13 or newer. Verify the download against the .sha256 file."

      - name: Remove the temporary keychain and profiles
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
