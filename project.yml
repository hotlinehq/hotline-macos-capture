# Xcode project description for XcodeGen (https://github.com/yonaskolb/XcodeGen).
# On a Mac: `brew install xcodegen && xcodegen`, then open HotlineCapture.xcodeproj.
# The generated project is not committed (see .gitignore).
# NOT YET TRIED: written without a Mac. Expect small fixes on the first run.
name: HotlineCapture
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.9"
    # Set your Apple team id here or pass DEVELOPMENT_TEAM=... to xcodebuild.
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    # Raise this on EVERY change to the extension, or macOS keeps the old one.
    CURRENT_PROJECT_VERSION: "2"
packages:
  HotlineCapture:
    path: .
targets:
  HotlineCapture:
    type: application
    platform: macOS
    sources: [App]
    # The Info.plist and entitlements files are ours: they are named in build settings only.
    # XcodeGen's own `info:` and `entitlements:` blocks would overwrite them with near empty
    # files (the first release shipped that way and macOS refused to install the extension).
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # The name of the provisioning profile (see docs/release-setup.md), so a signed build finds it.
        PROVISIONING_PROFILE_SPECIFIER: "Hotline Capture"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: io.github.petercipov.hotlinecapture
        PRODUCT_NAME: Hotline Capture
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES
        # The app icon comes from App/Assets.xcassets (made from docs/logo.svg).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HotlineCaptureExtension
        embed: true
        codeSign: true
        destinationPath: $(SYSTEM_EXTENSIONS_FOLDER_PATH)
      - package: HotlineCapture
        product: CaptureCore
  HotlineCaptureExtension:
    type: system-extension
    platform: macOS
    sources: [Extension]
    settings:
      base:
        INFOPLIST_FILE: Extension/Info.plist
        PROVISIONING_PROFILE_SPECIFIER: "Hotline Capture Extension"
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: io.github.petercipov.hotlinecapture.extension
        PRODUCT_NAME: io.github.petercipov.hotlinecapture.extension
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OPTIMIZATION_LEVEL: -Osize
        DEAD_CODE_STRIPPING: YES
        STRIP_INSTALLED_PRODUCT: YES
    dependencies:
      - package: HotlineCapture
        product: CaptureCore
